project:
  sector: "Precision Agriculture"
  client: "John Deere"
  scope: "Crop production"
  reference: "Tey et al. (2024)"
  reference_doi: "10.1007/s11119-023-10076-y"

patstat:
  environment: "PROD"
  ipr_type: "PI"

analysis:
  year_min: 2000
  year_max: 2022
  family_time_column: "earliest_filing_year"

keywords:
  # Route 2: Standalone high-precision phrases (exact/stemmed)
  # Derived from historical terminology validated by Avola et al. (2024)
  specific:
    - "precision agriculture"
    - "precis* farm*"
    - "high-tech sustainable agriculture"
    - "site specific farming"
    - "site specific crop"
    - "site specific manage*"
    - "soil-specific crop management"
    - "spatially prescriptive farming"
    - "spatially variable field operations"
    - "variable rate technology"

  # Route 3: Agricultural context terms
  # Scoped to in-field operations, machinery, and spatial field context (aligned with John Deere scope)
  agricultural:
    # General domain root stems
    - "Agricultur*"
    - "Farm*"
    - "Cultivat*"
    - "Crop*"
    - "Cropland"
    - "Farmland"
    - "Harvest*"
    - "Sowing"
    - "Fertiliz*"

    # Field machinery, implements and spreaders
    - "Tractor*"
    - "Combine harvester*"
    - "Harvester*"
    - "Sprayer*"
    - "Planter*"
    - "Seeder*"
    - "Spreader*"
    - "Agricultural implement*"

    # In-field physical and spatial features
    - "In-field"
    - "Sub-field"
    - "Canopy"
    - "Furrow"

  # Route 3: Enabling technological terms
  # Restricting generic terms (e.g., standalone sensors/controls) to spatial, vision, and rate-control concepts
  technological:
    # GNSS, positioning, and geo-referencing
    - "GNSS"
    - "GPS"
    - "Global position*"
    - "Global navigation satellite"
    - "Geographic inform*"
    - "GIS"
    - "RTK"
    - "Real time kinematic*"
    - "Centimeter-level"

    # Guidance, auto-steer, and autonomous motion
    - "Auto-steer*"
    - "Autonomous vehicle*"
    - "Autonomous tractor*"
    - "Autonomous driv*"
    - "Guidance system*"

    # Variable-rate control, yield mapping, and prescriptive maps
    - "Variable rate*"
    - "Yield map*"
    - "Soil map*"
    - "Prescription map*"
    - "Yield monitor*"
    - "Soil sampl*"

    # Advanced optical sensing and spectral imaging
    - "Remote sens*"
    - "Optical sensor*"
    - "Lidar" # found in Avola et al. 
    - "Soil sensor*"
    - "Multispectral"
    - "Hyperspectral"
    - "NDVI"
    - "Computer vision"
    - "Canopy sensor*"

    # Field robotics and aerial/ground carriers
    - "Drone*"
    - "Unmanned aerial vehicle"
    - "UAV"
    - "Agricultural robot*"

    # Analytics and intelligence (standalone 'AI' omitted to prevent clash with active ingredient)
    - "Artificial intel*"
    - "Machine learn*"
    - "Data analytic*"
    - "Internet of Thing*"

    # Targeted application mechanisms
    - "Precision irrigat*"
    - "Spot spray*"
    - "Individual nozzle*"

cpc:
  # Route 1: Codes inherently dedicated to Precision Agriculture
  specific:
    - "A01B79/005"   # Data processing methods specifically adapted for precision agriculture
    - "A01B69/001"   # Optically assisted agricultural steering
    - "A01B69/004"   # Automatic guidance of mounted or towed agricultural implements
    - "A01B69/008"   # Automatic steering / autonomous navigation of agricultural vehicles
    - "A01D41/1271"  # Crop flow measurement in combine harvesters
    - "A01D41/1272"  # Grain flow measurement in combine harvesters
    - "A01D41/1278"  # Automatic steering and path tracking of combine harvesters
    #- "A01C21/005"   # Variable-rate fertilization methods (VRT)
    #- "A01C7/102"    # Calibrating and precision dispensing for seeders
    #- "A01M7/0089"   # Sprayers with individual nozzle control / targeted weed detection

  # Route 3: Context classification codes
  agricultural_context:
    - "A01B"         # Soil working, implements, and tractors
    - "A01C"         # Planting, sowing, and fertilizing
    - "A01D"         # Harvesting and combine thrashers
    - "A01G25/"      # Open-field irrigation systems
    - "A01M7/"       # Crop spraying and pest control

  # Negative filters (exclusions explicitly supported by literature)
  exclude:
    - "A01K"         # Livestock farming, animal husbandry, and milking machines
    - "C12N"         # Genetic engineering, molecular biology, and GMO breeding

ipc:
  specific: []
  agricultural_context:
    - "A01B"
    - "A01C"
    - "A01D"
    - "A01G25/"
    - "A01M7/"

validation:
  sample_size: 100
  random_seed: 38